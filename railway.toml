[build]
builder = "NIXPACKS"

[build.nixpacksPlan.phases.setup]
nixPkgs = ["python311"]

[build.nixpacksPlan.phases.install]
cmds = ["python3 -m venv /app/.venv && /app/.venv/bin/pip install -r requirements.txt"]

[build.nixpacksPlan.phases.build]
cmds = []

[deploy]
startCommand = "/app/.venv/bin/uvicorn api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/sample-jd"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"

[[services]]
name = "resume-screening-api"
